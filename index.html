<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
        }
        .balance-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #334155;
        }
        .balance-box h2 {
            margin: 0;
            color: #4ade80;
            font-size: 28px;
        }
        .btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        .wheel-container {
            margin: 15px 0;
            position: relative;
        }
        #wheel {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #38bdf8;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background: conic-gradient(#f43f5e 0deg 90deg, #eab308 90deg 180deg, #10b981 180deg 270deg, #6366f1 270deg 360deg);
            transition: transform 3s cubic-bezier(0.15, 0.95, 0.15, 1);
        }
        .steps-info {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Walkpay 🚀</h1>
        
        <div class="balance-box">
            <p style="margin: 0 0 5px 0; color: #94a3b8;">Your Balance</p>
            <h2 id="balance">100</h2>
            <p style="margin: 5px 0 0 0; color: #4ade80;">Coins</p>
        </div>

        <!-- Walk & Earn Section -->
        <div style="background: #0f172a; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155;">
            <p style="margin: 0; font-weight: bold;">👟 Walk & Earn</p>
            <p class="steps-info">Steps: <span id="stepCount">0</span></p>
            <button class="btn" onclick="claimStepCoins()" style="margin-top: 8px; padding: 8px; background: #10b981;">Claim Step Coins</button>
        </div>

        <!-- Daily Check-in -->
        <button class="btn" id="checkinBtn" onclick="dailyCheckIn()">🎁 Daily Check-in (+10)</button>

        <!-- Spin & Win Section -->
        <div class="wheel-container">
            <div id="wheel">Spin</div>
        </div>
        <button class="btn" id="spinBtn" onclick="spinWheel()">🎡 Spin & Win</button>
    </div>

    <script>
        let coins = 100;
        let steps = 0;
        let canCheckIn = true;
        let canSpin = true;

        // Update Balance UI
        function updateUI() {
            document.getElementById("balance").innerText = coins;
            document.getElementById("stepCount").innerText = steps;
        }

        // Daily Check-in Logic
        function dailyCheckIn() {
            if (canCheckIn) {
                coins += 10;
                canCheckIn = false;
                let btn = document.getElementById("checkinBtn");
                btn.innerText = "Claimed Today ✅";
                btn.disabled = true;
                updateUI();
                alert("Successfully claimed 10 daily coins!");
            }
        }

        // Spin & Win Logic
        let currentRotation = 0;
        function spinWheel() {
            if (!canSpin) return;
            canSpin = false;
            let spinBtn = document.getElementById("spinBtn");
            spinBtn.disabled = true;

            let wheel = document.getElementById("wheel");
            let randomDegree = Math.floor(Math.random * 360) + 1440; // At least 4 full rotations
            currentRotation += randomDegree;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                let wonCoins = [10, 20, 50, 5][Math.floor(Math.random() * 4)];
                coins += wonCoins;
                updateUI();
                alert(`Congratulations! You won ${wonCoins} coins from Spin!`);
                spinBtn.disabled = false;
                canSpin = true;
            }, 3000);
        }

        // Simulated Walking Steps (Increases automatically to simulate movement)
        setInterval(() => {
            steps += Math.floor(Math.random() * 5) + 1;
            document.getElementById("stepCount").innerText = steps;
        }, 3000);

        // Claim Coins based on Steps
        function claimStepCoins() {
            let earnedFromSteps = Math.floor(steps / 20); // Every 20 steps = 1 coin
            if (earnedFromSteps > 0) {
                coins += earnedFromSteps;
                steps = 0; // Reset steps after claiming
                updateUI();
                alert(`Successfully claimed coins from walking!`);
            } else {
                alert("Walk more steps to claim coins!");
            }
        }

        updateUI();
    </script>
</body>
            </html>
