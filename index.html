<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay - Presale</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
        <h1 class="text-xl font-bold text-emerald-400">Walkpay</h1>
        <button onclick="showComingSoon()" class="bg-slate-700 text-xs px-3 py-1.5 rounded-lg text-slate-300">Settings ⚙️</button>
    </div>

    <!-- Main Dashboard & Presale Stages -->
    <div class="space-y-4 my-auto">
        <div class="bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700">
            <p class="text-slate-400 text-sm">Welcome back,</p>
            <h2 class="text-2xl font-bold mb-3">Aravindh!</h2>
            <div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center">
                <span class="text-slate-400 text-sm">Total Balance</span>
                <span class="text-emerald-400 font-bold text-lg">288 Coins</span>
            </div>
        </div>

        <!-- Presale Stages Box -->
        <div class="bg-slate-800 p-4 rounded-2xl shadow-xl border border-emerald-500/50">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs text-emerald-400 font-bold uppercase tracking-wider">🔥 Presale Live</span>
                <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full font-semibold">Stage 1 Active</span>
            </div>

            <!-- Stages List -->
            <div class="space-y-2 text-xs mb-4 bg-slate-900 p-3 rounded-xl text-slate-300">
                <div class="flex justify-between font-bold text-emerald-400 border-b border-slate-800 pb-1">
                    <span>Stage 1:</span> <span>₹8 per Coin (Live)</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Stage 2:</span> <span>₹12 per Coin</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Stage 3:</span> <span>₹16 per Coin</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Stage 4:</span> <span>₹20 per Coin</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Stage 5:</span> <span>₹24 per Coin</span>
                </div>
                <div class="flex justify-between font-bold text-amber-400 pt-1 border-t border-slate-800">
                    <span>Listing Price:</span> <span>₹25</span>
                </div>
            </div>

            <button onclick="openBuyModal()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg text-sm">
                Buy Walkpay Now 🚀
            </button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bg-slate-800 p-3 rounded-2xl flex justify-around text-xs border border-slate-700 text-slate-400">
        <span class="text-emerald-400 font-bold">Dashboard</span>
        <span onclick="showComingSoon()" class="cursor-pointer">Earn</span>
        <span onclick="showComingSoon()" class="cursor-pointer">Gaming</span>
        <span onclick="showComingSoon()" class="cursor-pointer">Staking</span>
    </div>

    <script>
        function showComingSoon() {
            alert("🚀 This feature will unlock soon after the official launch.");
        }
        function openBuyModal() {
            alert("💡 Presale Wallet Address:\n\nSend SOL to your Presale Wallet and contact admin to claim Stage 1 coins at ₹8!");
        }
    </script>
</body>
</html>
