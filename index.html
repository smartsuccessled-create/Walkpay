            <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay 🚀</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #1a1d24; --card-bg: #222632; --accent: #ec4899; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: white; padding: 15px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .card { background-color: var(--card-bg); width: 100%; max-width: 400px; padding: 18px; border-radius: 16px; margin-bottom: 12px; text-align: center; }
        .btn { background-color: #2ed573; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-checkin { background-color: #0ea5e9; }
        
        .wheel-wrapper { position: relative; width: 220px; height: 220px; margin: 15px auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#f59e0b 0deg 72deg, #ef4444 72deg 144deg, #8b5cf6 144deg 216deg, #06b6d4 216deg 288deg, #10b981 288deg 360deg); border: 6px solid #334155; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid #fff; z-index: 10; }
    </style>
</head>
<body>

    <div class="card">
        <h3 style="margin: 0; color: #94a3b8; font-size: 14px;">Your Balance</h3>
        <h1 id="coinBalance" style="margin: 5px 0; font-size: 32px; color: #2ed573;">282</h1>
    </div>

    <div class="card">
        <h3>👟 Walk & Earn</h3>
        <p>Steps: <span id="stepCount" style="font-weight: bold; color: #f59e0b;">0</span></p>
        <button class="btn" onclick="claimStepCoins()">Claim Step Coins</button>
    </div>

    <div class="card">
        <button class="btn btn-checkin" onclick="dailyCheckIn()">🎁 Daily Check-in (+10)</button>
    </div>

    <div class="card">
        <h3>🎡 Spin & Win</h3>
        <div class="wheel-wrapper"><div class="pointer"></div><div class="wheel" id="wheel"></div></div>
        <button class="btn" id="spinBtn" style="background:var(--accent);" onclick="spinWheel()">Spin & Win</button>
        <p id="spinStatus" style="font-size: 12px; color: #94a3b8; margin-top: 8px;"></p>
    </div>

    <script>
        let userCoins = 282;
        let currentSteps = 0;
        let lastAcceleration = 0;

        // Sensitvity logic: அதிகப்படியான அதிர்வு இருந்தால் மட்டுமே கணக்கிடும்
        window.addEventListener('devicemotion', function(event) {
            let acc = event.accelerationIncludingGravity;
            let totalAcc = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
            
            // 15-க்கு மேல் அதிர்வு இருந்தால் மட்டுமே ஒரு ஸ்டெப் (Sensitivity reduced)
            if (totalAcc > 15 && Math.abs(totalAcc - lastAcceleration) > 5) {
                currentSteps++;
                document.getElementById('stepCount').innerText = currentSteps;
            }
            lastAcceleration = totalAcc;
        });

        function claimStepCoins() {
            if (currentSteps >= 20) { // குறைந்தபட்சம் 20 ஸ்டெப்ஸ் நடந்தால் மட்டுமே கிளைம் முடியும்
                let earned = Math.floor(currentSteps / 20);
                userCoins += earned;
                document.getElementById("coinBalance").innerText = userCoins;
                currentSteps = 0;
                document.getElementById('stepCount').innerText = currentSteps;
                alert("Success! Claimed coins.");
            } else {
                alert("Walk more! Need at least 20 steps to claim.");
            }
        }

        function dailyCheckIn() {
            let today = new Date().toDateString();
            if (localStorage.getItem("lastCheckIn") === today) { alert("Already checked in!"); return; }
            userCoins += 10;
            document.getElementById("coinBalance").innerText = userCoins;
            localStorage.setItem("lastCheckIn", today);
            alert("Checked in!");
        }

        function spinWheel() {
            let today = new Date().toDateString();
            if (localStorage.getItem("lastSpin") === today) return;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("wheel").style.transform = `rotate(${Math.floor(Math.random() * 360) + 1800}deg)`;
            setTimeout(() => {
                localStorage.setItem("lastSpin", today);
                userCoins += 20;
                document.getElementById("coinBalance").innerText = userCoins;
                alert("Won 20 coins!");
                document.getElementById("spinBtn").innerText = "Come back tomorrow";
            }, 4200);
        }
    </script>
</body>
</html>
