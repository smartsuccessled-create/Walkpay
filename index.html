<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalkpayHub - Micro Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #07090e;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #0b0f19;
            padding: 16px 16px 95px 16px;
            position: relative;
            min-height: 100vh;
            border-left: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
        }

        .section-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .section-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Styles */
        .app-header {
            margin-bottom: 20px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .header-top h2 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(45deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .action-chip {
            background: #131b2e;
            color: #38bdf8;
            border: 1px solid #1e3a8a;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .welcome-text {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Main Wallet Banner (FaucetPay Style) */
        .wallet-banner {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 1px solid #312e81;
            padding: 18px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .wallet-banner span {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .wallet-banner h1 {
            font-size: 26px;
            color: #38bdf8;
            margin: 6px 0;
            font-weight: 800;
        }

        .banner-buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn-primary-custom, .btn-secondary-custom {
            flex: 1;
            padding: 9px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-primary-custom {
            background: #2563eb;
            color: #fff;
        }

        .btn-secondary-custom {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-card {
            background-color: #111827;
            padding: 10px 6px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #1f2937;
        }
