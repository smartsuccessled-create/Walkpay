<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay 🚀</title>
    <style>
        :root { --bg-color: #1a1d24; --card-bg: #222632; --accent: #ec4899; }
        body { 
            font-family: sans-serif; background-color: var(--bg-color); color: white; 
            margin: 0; padding: 15px; display: flex; flex-direction: column; 
            height: 100vh; overflow-y: auto; /* இதுதான் மிக முக்கியம் - ஸ்க்ரோல் செய்ய உதவும் */
        }
        .card { background-color: var(--card-bg); width: 100%; max-width: 400px; padding: 15px; border-radius: 16px; margin-bottom: 12px; align-self: center; }
        .btn { background-color: #2ed573; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-blue { background-color: #0ea5e9; }
    </style>
</head>
<body>

    <!-- Balance -->
    <div class="card">
        <h3>Your Balance: <span style="color:#2ed573;">287</span></h3>
    </div>

    <!-- Walk -->
    <div class="card">
        <h3>👟 Walk & Earn</h3>
        <p>Steps: <span id="stepCount">0</span></p>
        <button class="btn" onclick="claim()">Claim Step Coins</button>
    </div>

    <!-- Daily Check-in -->
    <div class="card">
        <button class="btn btn-blue" onclick="checkIn()">🎁 Daily Check-in (+10)</button>
    </div>

    <!-- Spin -->
    <div class="card">
        <h3>🎡 Spin & Win</h3>
        <button class="btn" style="background:var(--accent);" onclick="alert('Spinning...')">Spin Now</button>
    </div>

    <!-- Settings -->
    <div class="card">
        <h3>⚙️ Settings</h3>
        <button class="btn" style="background:#475569;" onclick="alert('Settings Page')">Account Settings</button>
    </div>

    <script>
        // நடப்பைக் கணக்கிட (Steps logic)
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (acc && Math.abs(acc.z) > 10) { // இன்னும் கொஞ்சம் கடினமாக்கியிருக்கிறேன்
                document.getElementById('stepCount').innerText = parseInt(document.getElementById('stepCount').innerText) + 1;
            }
        });

        function claim() { alert("Coins claimed!"); }
        function checkIn() { alert("Daily checked in!"); }
    </script>
</body>
</html>
