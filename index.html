        
                <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay 🚀</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #1a1d24; --card-bg: #222632; --primary-color: #0088cc; --text-color: #ffffff; --accent: #ec4899; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background-color: var(--card-bg); width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; margin-bottom: 15px; text-align: center; }
        .btn { background-color: #2ed573; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* Spin Wheel Style */
        .wheel-wrapper { position: relative; width: 250px; height: 250px; margin: 20px auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#f59e0b 0deg 72deg, #ef4444 72deg 144deg, #8b5cf6 144deg 216deg, #06b6d4 216deg 288deg, #10b981 288deg 360deg); border: 6px solid #334155; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid #fff; }
    </style>
</head>
<body>
    <!-- Dashboard -->
    <div class="card">
        <h2>Your Balance</h2>
        <h1 id="coinBalance">100</h1>
        <button class="btn" onclick="claimCoins()">Claim Coins</button>
        <button class="btn" style="background:#0ea5e9;" onclick="dailyCheckIn()">Daily Check-in (+10)</button>
    </div>

    <!-- Spin Section -->
    <div class="card">
        <h3>Spin & Win</h3>
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>
        <button class="btn" id="spinBtn" style="background:var(--accent);" onclick="spinWheel()">Spin & Win</button>
        <p id="statusText" style="font-size:12px; margin-top:10px;"></p>
    </div>

    <script>
        let userCoins = 100;
        let isSpinning = false;

        function claimCoins() { userCoins += 5; document.getElementById("coinBalance").innerText = userCoins; }
        
        function dailyCheckIn() {
            let today = new Date().toDateString();
            if (localStorage.getItem("lastCheckIn") === today) { alert("Already checked in today!"); return; }
            userCoins += 10;
            document.getElementById("coinBalance").innerText = userCoins;
            localStorage.setItem("lastCheckIn", today);
            alert("Checked in successfully!");
        }

        function spinWheel() {
            let today = new Date().toDateString();
            if (isSpinning || localStorage.getItem("lastSpin") === today) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("wheel").style.transform = `rotate(${Math.floor(Math.random() * 360) + 1800}deg)`;
            
            setTimeout(() => {
                localStorage.setItem("lastSpin", today);
                userCoins += 20;
                document.getElementById("coinBalance").innerText = userCoins;
                alert("You won 20 coins!");
                document.getElementById("statusText").innerText = "Come back tomorrow!";
                isSpinning = false;
            }, 4200);
        }
    </script>
</body>
</html>
