<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay Mini App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { color: #38bdf8; font-size: 24px; }
        .balance {
            font-size: 32px;
            font-weight: bold;
            color: #4ade80;
            margin: 20px 0;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #0ea5e9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Walkpay 🚀</h1>
        <p>Your Balance</p>
        <div class="balance" id="coinCount">100 Coins</div>
        
        <button onclick="dailyCheckIn()">🎁 Daily Check-in</button>
        <button onclick="spinWheel()">🎡 Spin & Win</button>
        <button onclick="inviteFriend()">👥 Invite Friends (10 Coins)</button>
    </div>

    <script>
        let coins = 100;
        function updateCoins() {
            document.getElementById('coinCount').innerText = coins + " Coins";
        }
        function dailyCheckIn() {
            coins += 10;
            alert("Daily check-in successful! +10 Coins");
            updateCoins();
        }
        function spinWheel() {
            coins += 25;
            alert("You spun and won! +25 Coins");
            updateCoins();
        }
        function inviteFriend() {
            alert("Share your referral link with friends to earn more!");
        }
    </script>
</body>
</html>
