<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay Super App</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #22c55e; --accent: #8b5cf6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: white; margin: 0; padding: 20px; }
        .page { display: none; }
        .active { display: block; }
        .card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; }
        button { background: var(--primary); color: white; padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; }
        .wheel { width: 200px; height: 200px; border-radius: 50%; border: 5px solid #fff; margin: 20px auto; background: conic-gradient(red 0deg 72deg, orange 72deg 144deg, yellow 144deg 216deg, green 216deg 288deg, blue 288deg 360deg); transition: 4s; }
    </style>
</head>
<body>

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="page active">
        <h2>Welcome to Walkpay</h2>
        <input type="text" id="username" placeholder="Enter Username">
        <button onclick="login()">Login / Signup</button>
    </div>

    <!-- DASHBOARD PAGE -->
    <div id="dashboardPage" class="page">
        <div class="card">
            <h3>Balance: <span id="balance">0</span> Coins</h3>
        </div>
        
        <div class="card">
            <h3>👟 Walk & Earn</h3>
            <p>Steps: <span id="steps">0</span></p>
            <button onclick="claimSteps()">Claim Coins</button>
        </div>

        <div class="card">
            <button onclick="checkIn()" id="checkInBtn">🎁 Daily Check-in (+10)</button>
        </div>

        <div class="card">
            <h3>🎡 Spin & Win</h3>
            <div id="wheel" class="wheel"></div>
            <button onclick="spin()">Spin Now</button>
        </div>
    </div>

    <script>
        let balance = 0;
        let steps = 0;

        function login() {
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('dashboardPage').classList.add('active');
        }

        // Pedometer Logic
        window.addEventListener('devicemotion', (e) => {
            if(Math.abs(e.accelerationIncludingGravity.z) > 10) steps++;
            document.getElementById('steps').innerText = steps;
        });

        function claimSteps() {
            balance += Math.floor(steps / 20);
            steps = 0;
            updateUI();
        }

        function checkIn() {
            let lastCheck = localStorage.getItem('lastCheckIn');
            if(lastCheck === new Date().toDateString()) return alert("Already claimed today!");
            balance += 10;
            localStorage.setItem('lastCheckIn', new Date().toDateString());
            updateUI();
        }

        function spin() {
            let deg = Math.floor(Math.random() * 360) + 1800;
            document.getElementById('wheel').style.transform = `rotate(${deg}deg)`;
            setTimeout(() => { balance += 50; updateUI(); alert("You won 50 coins!"); }, 4000);
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance;
        }
    </script>
</body>
</html>
