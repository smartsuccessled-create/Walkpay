        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay 🚀</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #1a1d24; --card-bg: #222632; --accent: #ec4899; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: white; padding: 15px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .card { background-color: var(--card-bg); width: 100%; max-width: 400px; padding: 18px; border-radius: 16px; margin-bottom: 12px; text-align: center; }
        .btn { background-color: #2ed573; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Your Balance</h3>
        <h1 id="coinBalance">282</h1>
    </div>

    <div class="card">
        <h3>👟 Walk & Earn</h3>
        <p>Steps: <span id="stepCount" style="font-weight: bold; color: #f59e0b;">0</span></p>
        <button class="btn" onclick="claimStepCoins()">Claim Step Coins</button>
    </div>

    <!-- ... (Spin & Daily Check-in remains same) ... -->

    <script>
        let userCoins = 282;
        let currentSteps = 0;
        let lastZ = 0;

        // "Walking Pattern" Logic:
        // இது போனை ஷேக் செய்வதற்கு பதிலாக, நடக்கும்போது போனில் ஏற்படும் 
        // குறிப்பிட்ட அசைவை (UpDown movement) மட்டும் கண்டறியும்.
        window.addEventListener('devicemotion', function(event) {
            let acc = event.accelerationIncludingGravity;
            if (!acc) return;

            // Z-axis-ல் ஏற்படும் மாற்றத்தை வைத்து நடப்பைக் கணக்கிடுகிறது
            let currentZ = acc.z;
            
            // 2.0-க்கு மேல் வித்தியாசம் இருந்தால் மற்றும் அது ஒரு சீரான வேகத்தில் இருந்தால்
            if (Math.abs(currentZ - lastZ) > 2.0) {
                currentSteps++;
                document.getElementById('stepCount').innerText = currentSteps;
            }
            lastZ = currentZ;
        }, false);

        function claimStepCoins() {
            if (currentSteps >= 20) {
                userCoins += Math.floor(currentSteps / 20);
                document.getElementById("coinBalance").innerText = userCoins;
                currentSteps = 0;
                document.getElementById('stepCount').innerText = currentSteps;
                alert("Coins Claimed!");
            } else {
                alert("Please walk more to earn!");
            }
        }
        
        // ... (Daily Check-in & Spin Logic)
    </script>
</body>
</html>
