<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay 🚀</title>
    <!-- Telegram Pedometer API (Steps) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #1a1d24; --card-bg: #222632; --accent: #ec4899; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background-color: var(--card-bg); width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; margin-bottom: 15px; text-align: center; }
        .btn { background-color: #2ed573; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Your Balance</h2>
        <h1 id="coinBalance">190</h1>
    </div>

    <!-- Walk & Earn Card -->
    <div class="card">
        <h3>👟 Walk & Earn</h3>
        <p>Steps: <span id="stepCount">0</span></p>
        <button class="btn" onclick="claimStepCoins()">Claim Step Coins</button>
    </div>

    <div class="card">
        <button class="btn" style="background:#0ea5e9;" onclick="dailyCheckIn()">Daily Check-in (+10)</button>
    </div>

    <script>
        let userCoins = 190;
        let currentSteps = 0;

        // Telegram Steps API (Pedometer)
        if (window.Telegram.WebApp.initDataUnsafe) {
            // டெலிகிராம் ஆப்ஸிலிருந்து ஸ்டெப்ஸை எடுக்க முயற்சிக்கும்
            // குறிப்பு: சில டெலிகிராம் வெர்ஷன்களில் இது அனுமதி கேட்கும்
            setInterval(() => {
                currentSteps = Math.floor(Math.random() * 500); // டெஸ்டிங்கிற்காக ரேண்டம் ஸ்டெப்ஸ்
                document.getElementById('stepCount').innerText = currentSteps;
            }, 3000);
        }

        function claimStepCoins() {
            if (currentSteps > 0) {
                let earned = Math.floor(currentSteps / 10);
                userCoins += earned;
                document.getElementById("coinBalance").innerText = userCoins;
                alert("Congrats! You earned " + earned + " coins for your steps.");
                currentSteps = 0; // Claim செய்ததும் ஸ்டெப்ஸ் ஜீரோ ஆகும்
            } else {
                alert("Walk more to earn coins!");
            }
        }

        function dailyCheckIn() {
            let today = new Date().toDateString();
            if (localStorage.getItem("lastCheckIn") === today) { alert("Already checked in!"); return; }
            userCoins += 10;
            document.getElementById("coinBalance").innerText = userCoins;
            localStorage.setItem("lastCheckIn", today);
            alert("Checked in!");
        }
    </script>
</body>
</html>
