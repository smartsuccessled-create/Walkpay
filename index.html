<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkpay 🚀</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #ec4899; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        
        /* Spin Wheel Design */
        .wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 20px 0; }
        .wheel { 
            width: 100%; height: 100%; border-radius: 50%; 
            background: conic-gradient(#f59e0b 0deg 72deg, #ef4444 72deg 144deg, #8b5cf6 144deg 216deg, #06b6d4 216deg 288deg, #10b981 288deg 360deg);
            border: 8px solid #334155; transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #fff; z-index: 10; }
        
        .btn-spin { background: var(--accent); color: white; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 18px; }
        .btn-spin:disabled { background: #475569; }
    </style>
</head>
<body>
    <h2>Walkpay Lucky Wheel</h2>
    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
    </div>
    
    <button class="btn-spin" id="spinBtn" onclick="spinWheel()">Spin & Win</button>
    <p id="statusText">You have 1 spin left for today.</p>

    <script>
        let tg = window.Telegram.WebApp;
        let isSpinning = false;
        
        // Daily Limit Logic
        function checkSpinLimit() {
            let today = new Date().toDateString();
            if (localStorage.getItem("lastSpinDate") === today) {
                document.getElementById("spinBtn").disabled = true;
                document.getElementById("statusText").innerText = "Come back tomorrow for your next spin!";
            }
        }
        checkSpinLimit();

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            
            let rotation = Math.ceil(Math.random() * 360) + 2000;
            document.getElementById("wheel").style.transform = `rotate(${rotation}deg)`;
            
            setTimeout(() => {
                localStorage.setItem("lastSpinDate", new Date().toDateString());
                alert("Congratulations! You won bonus coins!");
                checkSpinLimit();
                isSpinning = false;
            }, 5500);
        }
    </script>
</body>
</html>
